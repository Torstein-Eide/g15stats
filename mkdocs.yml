site_name: G15Stats
site_description: A CPU/Memory/Swap/Network/Battery/Temperature/Fan Speed/CPU Frequencies usage meter for G15Daemon
site_author: G15Stats Contributors
repo_url: https://github.com/Torstein-Eide/g15stats
repo_name: g15stats

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home:
    - index.md
    - Install: installation.md
    - Quick start: quick-start.md
    - What does G15Stats do: what-does-g15stats-do.md
  - User guide:
    - Usage: usage.md
    - Options: options.md
    - Screens: screens.md
    - Requirements: requirements.md
  - Developer guide:
    - Contributing: contributing.md
    - Changelog: changelog.md
    - Dependencies: DEPENDENCIES.md
    - Creating Documentation: Developing/Creating-Documentation.md
    - G15Mirror: Developing/G15Mirror.md

markdown_extensions:
  - admonition
  - tables
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Torstein-Eide/g15stats

copyright: Copyright &copy; 2026 G15Stats Contributors
